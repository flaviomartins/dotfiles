version = 1

[envs.sqlite]
channels = ["conda-forge"]
dependencies = { dbhash = "*", sqlite = "*", sqldiff = "*", sqlite_rsync = "*" }
exposed = { dbhash = "dbhash", sqlite3 = "sqlite3", sqldiff = "sqldiff", sqlite3_rsync = "sqlite3_rsync" }

[envs.duckdb]
channels = ["conda-forge"]
dependencies = { duckdb-cli = "*" }
exposed = { duckdb = "duckdb" }

[envs.ffmpeg]
channels = ["conda-forge"]
dependencies = { ffmpeg = "*", yt-dlp = "*" }
exposed = { yt-dlp = "yt-dlp", ffmpeg = "ffmpeg", ffprobe = "ffprobe", ffplay = "ffplay" }

[envs.postgres]
channels = [
  "https://conda.anaconda.org/conda-forge/label/postgresql_rc",
  "conda-forge"
]
dependencies = { postgresql = "19.0rc2.*" }
exposed = { clusterdb = "clusterdb", createdb = "createdb", createuser = "createuser", dropdb = "dropdb", dropuser = "dropuser", ecpg = "ecpg", initdb = "initdb", oid2name = "oid2name", pg_amcheck = "pg_amcheck", pg_archivecleanup = "pg_archivecleanup", pg_basebackup = "pg_basebackup", pg_checksums = "pg_checksums", pg_combinebackup = "pg_combinebackup", pg_controldata = "pg_controldata", pg_createsubscriber = "pg_createsubscriber", pg_ctl = "pg_ctl", pg_dump = "pg_dump", pg_dumpall = "pg_dumpall", pg_isready = "pg_isready", pg_receivewal = "pg_receivewal", pg_recvlogical = "pg_recvlogical", pg_resetwal = "pg_resetwal", pg_restore = "pg_restore", pg_rewind = "pg_rewind", pg_test_fsync = "pg_test_fsync", pg_test_timing = "pg_test_timing", pg_upgrade = "pg_upgrade", pg_verifybackup = "pg_verifybackup", pg_waldump = "pg_waldump", pg_walsummary = "pg_walsummary", pgbench = "pgbench", postgres = "postgres", psql = "psql", reindexdb = "reindexdb", vacuumdb = "vacuumdb", vacuumlo = "vacuumlo" }
