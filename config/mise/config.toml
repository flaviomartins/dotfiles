[settings]
idiomatic_version_file_enable_tools = ["java", "node", "ruby", "rust", "python"]
idiomatic_version_file_disable_files = ["node:package.json"]
env_file = "true"

[settings.self_update]
auto = false

[tools]
awscli = { version = "latest", symlink_bins = "true" }
go = "1.27"
java = "lts"
node = "26"
python = "3.15"
ruby = "4.0"
terraform = "latest"
uv = "latest"
